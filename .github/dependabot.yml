version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v0.48.0+ requires Go 1.26; lift this only with a manual Go support change.
      - dependency-name: golang.org/x/sys
        versions:
          - ">= 0.48.0"
    labels:
      - dependencies
      - go

name: Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration for each fuzz target
        required: true
        default: 10m
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzDecodeBatch
          - FuzzDecodeSegmentHeader
          - FuzzPreflightSystemLogSegment
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZTIME: ${{ inputs.fuzztime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - name: Fuzz
        run: go test ./storage -run '^$' -fuzz="$FUZZ_TARGET" -fuzztime="$FUZZTIME" -parallel=1

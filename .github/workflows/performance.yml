name: Performance evidence

on:
  workflow_dispatch:
    inputs:
      benchtime:
        description: Go benchmark duration per sample
        required: true
        default: 1s
        type: string
      benchmark_count:
        description: Repeated benchmark samples
        required: true
        default: "5"
        type: string
      run_soak_smoke:
        description: Run the fixed-seed mixed-workload smoke
        required: true
        default: false
        type: boolean
      soak_profile:
        description: Soak workload profile
        required: true
        default: mixed
        type: choice
        options:
          - mixed
          - sustained
      soak_duration:
        description: Optional soak smoke duration
        required: true
        default: 20s
        type: string
      soak_producer_rate:
        description: Optional aggregate sustained producer rate in records/s
        required: true
        default: "0"
        type: string
      soak_analyze:
        description: Analyze structured soak metrics
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Informational performance evidence
    runs-on: ubuntu-latest
    env:
      BENCHTIME: ${{ inputs.benchtime }}
      BENCHMARK_COUNT: ${{ inputs.benchmark_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - name: Record environment
        shell: bash
        run: |
          mkdir -p perf-results
          go version > perf-results/environment.txt
          go env -json GOOS GOARCH GOAMD64 GOMAXPROCS > perf-results/go-env.json
          uname -a >> perf-results/environment.txt
          grep -m1 'model name' /proc/cpuinfo >> perf-results/environment.txt
          nproc >> perf-results/environment.txt
          findmnt -T . >> perf-results/environment.txt
          df -T . >> perf-results/environment.txt
          git rev-parse HEAD >> perf-results/environment.txt
      - name: Run microbenchmarks
        shell: bash
        run: |
          go test ./perf/benchmarks -run '^$' -bench . -benchmem -benchtime="$BENCHTIME" -count="$BENCHMARK_COUNT" | tee perf-results/benchmarks.txt
      - name: Run optional soak smoke
        if: ${{ inputs.run_soak_smoke }}
        shell: bash
        run: |
          perf/soak/run.sh \
            --run-dir "$GITHUB_WORKSPACE/perf-results/soak" \
            --profile "${{ inputs.soak_profile }}" \
            --duration "${{ inputs.soak_duration }}" \
            --producer-rate "${{ inputs.soak_producer_rate }}" \
            --timeout 90s \
            --minimum-free-bytes 0 \
            --minimum-open-files 0 \
            ${{ inputs.soak_analyze && '--analyze' || '' }}
      - name: Upload raw evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.run_id }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30
